[project]
name = "ai-washer"
version = "0.1.0"
description = "AI Washing Detector - quantifies the gap between AI claims and investment."
requires-python = ">=3.11,<3.14"
dependencies = [
    "sqlalchemy>=2.0.48",
    "psycopg[binary]>=3.2",
    "alembic>=1.18.4",
    "pydantic>=2.12.5",
    "pydantic-settings[yaml]>=2.13.1",
    "typer>=0.24.1",
    "rich>=14.0",
    "structlog>=25.5.0",
    "pyyaml>=6.0",
    "edgartools>=5.26.1",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.3",
    "tenacity>=9.1.4",
    "earningscall>=2.0.1",
    "transformers>=5.3.0",
    "torch>=2.4,<3.0; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "python-jobspy>=1.1.82",
    "prefect>=3.6.23",
]

[project.scripts]
ai-washer = "ai_washer.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.3",
    "factory-boy>=3.3",
    "testcontainers[postgres]>=4.14",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_washer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests requiring PostgreSQL (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest-httpx>=0.36.0",
    "testcontainers[postgres]>=4.14",
]
