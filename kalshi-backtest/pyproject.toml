[project]
name = "kalshi-backtest"
version = "0.1.0"
description = "Strategy-agnostic backtesting engine for Kalshi prediction markets"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kalshi-python>=2.1.4",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "duckdb>=1.5.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "typer>=0.24.1",
    "structlog>=25.5.0",
    "rich>=14.0",
    "cryptography>=46.0.6",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "quantstats>=0.0.81",
    "plotly>=5.0",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
kalshi-backtest = "kalshi_backtest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_backtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "freezegun>=1.5.5",
]
