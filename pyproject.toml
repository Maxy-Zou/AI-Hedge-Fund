[project]
name = "ai-hedge-fund"
version = "0.1.0"
description = "AI-native hedge fund multi-agent research system"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.1.0",
    "langchain-core>=1.2.0",
    "langchain-anthropic>=1.4.0",
    "pydantic-ai>=1.0.0",
    "anthropic>=0.94.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "psycopg[binary,pool]>=3.3.0",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.0",
    "structlog>=25.0.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "langfuse>=4.0.0",
    "langchain>=1.2.15",
    "edgartools>=5.28.5",
    "yfinance>=1.2.1",
    "tiingo>=0.16.1",
    "fredapi>=0.5.2",
    "finnhub-python>=2.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_hedge_fund"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "archive",
    ".venv",
    ".planning",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-httpx>=0.36.2",
    "ruff>=0.15.10",
]
