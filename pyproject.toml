[project]
name = "ai-hedge-fund"
version = "0.1.0"
description = "AI-native hedge fund multi-agent research system"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.1.0,<2",
    "langchain-core>=1.2.0,<2",
    "langchain-anthropic>=1.4.0,<2",
    # 2.x required: AgentRunResult.usage is a property, not a method (graph/nodes.py)
    "pydantic-ai>=2.0.0,<3",
    "anthropic>=1.0.0,<2",
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.13.0,<3",
    "langgraph-checkpoint-postgres>=3.0.0,<4",
    "psycopg[binary,pool]>=3.3.0,<4",
    "sqlalchemy>=2.0.49,<3",
    "alembic>=1.18.0,<2",
    "structlog>=25.0.0,<27",
    "httpx>=0.28.0,<0.29",
    "tenacity>=9.0.0,<10",
    "langfuse>=4.0.0,<5",
    "langchain>=1.2.15,<2",
    "edgartools>=5.28.5,<6",
    "yfinance>=1.2.1,<2",
    "tiingo>=0.16.1,<0.17",
    "fredapi>=0.5.2,<0.6",
    "finnhub-python>=2.4.27,<3",
    "ruamel.yaml>=0.19.0,<0.20",
    "alpaca-py>=0.44,<1",
    # Direct import: the alpaca adapter classifies requests timeouts/connection
    # errors as transient. Already locked transitively via alpaca-py.
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.16.8,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_hedge_fund"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "archive",
    ".venv",
    ".planning",
    ".planning-archive",
    "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: slow tests (>1s) -- excluded from default subsuite via `-m 'not slow'`",
]

[dependency-groups]
dev = [
    "pytest-httpx>=0.36.2,<0.37",
    "ruff>=0.16.8,<0.17",
]
