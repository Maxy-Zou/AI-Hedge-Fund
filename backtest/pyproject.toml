[project]
name = "fund-backtest"
version = "0.1.0"
description = "Shared backtesting infrastructure for the AI Hedge Fund."
requires-python = ">=3.11,<3.14"
dependencies = [
    "yfinance>=1.2.0",
    "pandas>=3.0.1",
    "lxml>=5.0",
    "sqlalchemy>=2.0.48",
    "psycopg[binary]>=3.2",
    "alembic>=1.18.4",
    "pydantic>=2.12.5",
    "pydantic-settings[yaml]>=2.13.1",
    "typer>=0.24.1",
    "rich>=14.0",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "quantstats-lumi>=1.1.3",
]

[project.scripts]
fund-backtest = "fund_backtest.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0",
    "freezegun>=1.5.5",
    "factory-boy>=3.3",
    "testcontainers[postgres]>=4.14",
    "ruff>=0.15.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fund_backtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests requiring PostgreSQL (deselect with '-m not integration')",
]

[tool.coverage.run]
omit = [
    "src/fund_backtest/__main__.py",
    "src/fund_backtest/db/migrations/*",
]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
