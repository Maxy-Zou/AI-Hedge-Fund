[project]
name = "kalshi-tracker"
version = "0.1.0"
description = "Kalshi Insider Tracker — detects and copies insider-like trades on prediction markets"
requires-python = ">=3.11,<3.14"
dependencies = [
    "kalshi-python>=2.1.4",
    "sqlalchemy>=2.0.48",
    "psycopg[binary]>=3.2",
    "alembic>=1.18.4",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "structlog>=25.5.0",
    "tenacity>=9.1.4",
    "typer>=0.24.1",
    "rich>=14.0",
    "cryptography>=46.0.6",
    "apscheduler>=3.11.0",
]

[project.scripts]
kalshi-tracker = "kalshi_tracker.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0",
    "testcontainers[postgres]>=4.14",
    "ruff>=0.15",
    "freezegun>=1.5.5",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: integration tests requiring PostgreSQL (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "freezegun>=1.5.5",
    "pytest-asyncio>=1.0",
]
